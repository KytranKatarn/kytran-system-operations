# KSO on Citadel — rebuilt 2026-11-06 after hub loss. Image-baked.
# Mesh-only publish (100.64.0.10:8085): NOT routed through the public front door.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kytran-sysops-postgres
    environment:
      POSTGRES_USER: sysops
      POSTGRES_DB: sysops
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysops -d sysops"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 200
    security_opt: ["no-new-privileges:true"]

  kytran-system-operations:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        DOCKER_GID: ${DOCKER_GID:-988}
    image: kso-citadel:${GIT_SHA:-unknown}
    container_name: kytran-system-operations
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "100.64.0.10:8085:8085"
      - "172.17.0.1:8085:8085"      # beacon
    env_file: .env
    volumes:
      - ./data/app:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    secrets: [db_password]
    environment:
      KSO_THEME: kytran
      KSO_PORT: "8085"
      ARCHIE_BASE_DIR: /data
      KSO_ADMIN_USER: admin
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sysops
      DB_USER: sysops
      DB_PASSWORD_FILE: /run/secrets/db_password
      FLEET_NODE_HOSTS: "Outpost-US@100.64.0.2,Starship-246@100.64.0.3,Starship-245@100.64.0.6,Citadel@100.64.0.10"
      KYTRAN_CLIENT_ID: kso
      KYTRAN_AUTH_URL: https://platform.kytranempowerment.com
      KYTRAN_REDIRECT_URI: https://server.kytranempowerment.com/auth/kytran/callback
      KSO_ARCHIE_HUB_URL: http://100.64.0.10:3000
    dns: [1.1.1.1]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8085/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    tmpfs: [/tmp, /run]
    security_opt: ["no-new-privileges:true"]

secrets:
  db_password:
    file: ./secrets/db_password.txt
