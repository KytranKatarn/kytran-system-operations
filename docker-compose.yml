services:
  postgres:
    image: postgres:16-alpine
    container_name: kytran-sysops-postgres
    environment:
      POSTGRES_USER: sysops
      POSTGRES_DB: sysops
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysops -d sysops"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    security_opt:
      - no-new-privileges:true

  kytran-system-operations:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: kytran-system-operations
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Share ARCHIE's host monitor data + command queue
      - /mnt/archie_brain/host_monitor_data.json:/data/host_monitor_data.json:ro
      - /mnt/archie_brain/host_commands:/data/host_commands
    secrets:
      - db_password
    environment:
      - KSO_SECRET_KEY=${KSO_SECRET_KEY}
      - KSO_THEME=kytran
      - KSO_PORT=8085
      - ARCHIE_BASE_DIR=/data
      # Host admin auto-seed (skips first-run setup page)
      - KSO_ADMIN_USER=admin
      - KSO_ADMIN_PASSWORD=${KSO_ADMIN_PASSWORD}
      # Postgres sidecar (see above)
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sysops
      - DB_USER=sysops
      - DB_PASSWORD_FILE=/run/secrets/db_password
      # Cross-node Docker visibility (#3763) — mesh IPs only ("Name@meship,...").
      # node_api :3001 is now mesh-firewalled on every public outpost (DOCKER-USER
      # DROP via archie-nodeapi-firewall.service, KB #278720), so the full mesh
      # roster is safe. Beacon excluded — ingress-only, runs no node_api.
      - FLEET_NODE_HOSTS=${FLEET_NODE_HOSTS:-Outpost-US@100.64.0.2,Starship-246@100.64.0.3,Starship-245@100.64.0.6,Singapore@100.64.0.5,Lithuania@100.64.0.7,UK@100.64.0.8,Citadel@100.64.0.10}
      # ARCHIE hub SSO
      - KYTRAN_CLIENT_ID=kso
      - KYTRAN_AUTH_URL=https://platform.kytranempowerment.com
      - KYTRAN_REDIRECT_URI=https://server.kytranempowerment.com/auth/kytran/callback
      - KYTRAN_CLIENT_SECRET=${KYTRAN_CLIENT_SECRET}
      # ARCHIE hub chat proxy
      - KSO_ARCHIE_HUB_URL=http://192.168.1.200:3000
      - KSO_CHAT_API_KEY=${KSO_CHAT_API_KEY}
      # P.R.O.B.E. QA auth — internal-only /api/qa/auth, shared platform token
      - ARCHIE_QA_TOKEN=${ARCHIE_QA_TOKEN}
    # AdGuard primary, Cloudflare fallback for when AdGuard cycles or the
    # MagicDNS upstream SERVFAILs (see PR #258 for the 7-day Prowlarr
    # outage that surfaced this pattern).
    dns:
      - 192.168.1.200
      - 1.1.1.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8085/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 200
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true

secrets:
  db_password:
    file: ./secrets/db_password.txt
